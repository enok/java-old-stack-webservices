# Log4j 1.2.17. End of life since August 2015.
#
# XXX: root logger is INFO and StudentDao logs every fully interpolated SQL
# statement at INFO, so the access log contains student identifiers and, on the
# enrollment path, the full INSERT. This is a data-retention problem as well as
# a noise problem. See docs/LEGACY-SMELLS.md.

log4j.rootLogger=INFO, CONSOLE, FILE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c{1} - %m%n

log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.File=${catalina.base}/logs/studentrecord.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c - %m%n

log4j.logger.com.campusconnect.sis=INFO
log4j.logger.org.apache.cxf=WARN
log4j.logger.org.springframework=WARN

# TODO: turned on during a 2019 incident and never turned off.
log4j.logger.com.campusconnect.sis.dao.StudentDao=DEBUG
